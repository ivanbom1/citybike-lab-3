# MISSION 5 — Complete this workflow; submit a PR to trigger the quality gate.
name: CityBike E2E Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # TODO: set up Node.js 22
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # TODO: install npm packages
      - run: npm ci
      # TODO: install Playwright Chromium and system dependencies
      - run: npx playwright install --with-deps chromium  
      # TODO: execute tests; a failing test must fail the job
      - run: npx playwright test
      # TODO: upload the HTML report even when tests fail
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/